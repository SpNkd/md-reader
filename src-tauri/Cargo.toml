[package]
name = "md-reader"
version = "0.1.0"
description = "A focused, local Markdown reader and editor"
authors = ["MD Reader contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
homepage = "https://github.com/SpNkd/md-reader"
repository = "https://github.com/SpNkd/md-reader"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
