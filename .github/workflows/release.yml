name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
            rust_target: ""
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # The lockfile is generated on macOS, while this matrix also runs on
      # Linux and Windows. npm may omit Rollup's native optional package in
      # that situation, so repair the current runner without changing the
      # committed lockfile.
      - name: Repair platform optional dependencies
        run: npm install --no-save --package-lock=false --include=optional

      # Official Tauri action: it builds native bundles and stores them as
      # workflow artifacts. The publish job creates one release after all
      # matrix builds have finished.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: md-reader-${{ matrix.name }}-[bundle]

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-artifacts -type f \( \
            -iname '*.exe' -o \
            -iname '*.msi' -o \
            -iname '*.dmg' -o \
            -iname '*.appimage' -o \
            -iname '*.deb' \
          \) -print)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release installers found" >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "MD Reader ${GITHUB_REF_NAME}" \
            --notes "Download the installer for your operating system. macOS builds are currently unsigned and may require opening the app from Finder once." \
            --generate-notes
